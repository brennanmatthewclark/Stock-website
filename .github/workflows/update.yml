name: Update dashboard

on:
  schedule:
    - cron: "30 22 * * 1-5"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install requirements
        run: pip install -r requirements.txt
      - name: Fetch fresh stock data
        # If Yahoo blocks every request (it sometimes does for a while), wait and try the whole thing again.
        # Individual stocks that fail are already retried inside fetch_data.py.
        run: |
          for attempt in 1 2 3; do
            if python fetch_data.py --tickers tickers.txt --out data; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Attempt $attempt failed. Waiting 10 minutes before trying again."
              sleep 600
            fi
          done
          echo "All 3 attempts failed. The website keeps showing the last good data."
          exit 1
      - name: Save the data back to the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Update data $(date -u +%F)" && git pull --rebase && git push)
      - name: Build the website folder
        run: |
          mkdir public
          cp index.html public/
          cp new.html public/
          cp -r data public/data
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
